<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Juniper Creates</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #F6F8F5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: #fff; border-radius: 14px; padding: 40px 36px; width: 340px; max-width: 90vw;
    box-shadow: 0 12px 40px rgba(0,0,0,0.08); text-align: center;
  }
  .logo {
    width: 56px; height: 56px; border-radius: 50%; background: #2AAC8D; margin: 0 auto 18px auto;
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 26px; font-weight: 700;
  }
  h1 { font-size: 18px; margin: 0 0 4px 0; color: #1a1a1a; }
  p.sub { font-size: 13px; color: #666; margin: 0 0 24px 0; }
  /* Inputs and selects share one look so the account-type picker doesn't
     read as a stray native control next to the styled password field. */
  input[type="password"],
  input[type="email"],
  select {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid #d5d5d5;
    font-size: 15px; font-family: inherit; color: #1a1a1a; background-color: #fff;
    margin-bottom: 14px; -webkit-appearance: none; appearance: none;
  }
  input[type="password"]:focus,
  input[type="email"]:focus,
  select:focus { outline: none; border-color: #2AAC8D; }

  /* Same chevron the rest of the app uses on selects. */
  select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666666' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 18px;
    padding-right: 38px;
    cursor: pointer;
  }

  /* Only the submit button is the big green one - scoping this stops the
     "sign in with an account" text link inheriting it. */
  button[type="submit"] {
    width: 100%; padding: 13px 14px; border-radius: 8px; border: none; background: #2AAC8D;
    color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
    margin-top: 4px;
  }
  button[type="submit"]:hover { background: #229176; }
  button[type="submit"]:disabled { opacity: 0.6; cursor: default; }

  /* The account-type picker is a distinct decision from the password, so it
     gets its own separated block rather than being crowded against it. */
  .view-as {
    text-align: left;
    margin: 4px 0 20px 0;
    padding-top: 18px;
    border-top: 1px solid #ececec;
  }
  .view-as label {
    display: block; font-size: 12px; font-weight: 700; color: #666;
    text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px;
  }
  .view-as select:last-child { margin-bottom: 0; }

  .link-btn {
    background: none; border: none; color: #1F8570; font-size: 13px; font-weight: 600;
    cursor: pointer; margin-top: 16px; padding: 0; font-family: inherit;
  }
  .link-btn:hover { text-decoration: underline; }
  .error { color: #C0362C; font-size: 13px; margin-top: 12px; display: none; }

  /* Google sign-in, separated from the password form by a labelled rule so
     the two routes in don't read as one control stack. */
  .or-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 18px 0 16px 0; color: #999; font-size: 12px;
  }
  .or-divider::before, .or-divider::after {
    content: ''; flex: 1; height: 1px; background: #ececec;
  }
  .google-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 12px 14px; border-radius: 8px;
    border: 1.5px solid #d5d5d5; background: #fff; color: #1a1a1a;
    font-size: 14.5px; font-weight: 600; text-decoration: none; cursor: pointer;
  }
  .google-btn:hover { background: #f7f7f7; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="logo">J</div>
    <h1>Juniper Creates</h1>
    <p class="sub" id="subText">Enter the site password to continue</p>
    <input type="email" id="emailInput" placeholder="Email" autocomplete="username" style="display:none;" />
    <input type="password" id="passwordInput" placeholder="Password" autofocus autocomplete="current-password" />
    <div class="view-as" id="viewAsWrap">
      <label for="viewRoleSelect">View the site as</label>
      <select id="viewRoleSelect"></select>
      <select id="viewSupplierSelect" style="display:none;"></select>
    </div>
    <button type="submit" id="submitBtn">Continue</button>
    <div class="error" id="errorMsg">Incorrect password</div>
    <div id="googleWrap" style="display:none;">
      <div class="or-divider"><span>or</span></div>
      <a href="/auth/wecom" class="google-btn" id="wecomBtn" style="display:none;margin-bottom:10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#2F7DE1"/><path fill="#fff" d="M7 10.5h10v1.3H7zm0 2.6h7v1.3H7z"/></svg>
        <span id="wecomBtnText">Sign in with WeCom</span>
      </a>
      <a href="/auth/wechat" class="google-btn" id="wechatBtn" style="display:none;margin-bottom:10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#07C160" d="M8.7 3C4.5 3 1 5.9 1 9.5c0 2 1.1 3.8 2.9 5l-.7 2.2 2.5-1.3c.9.3 1.9.4 2.9.4h.5a5.6 5.6 0 0 1-.2-1.5c0-3.3 3.2-6 7.1-6h.6C15.9 5 12.6 3 8.7 3zm-2.5 3a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm5 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/><path fill="#07C160" d="M23 14.3c0-2.9-2.9-5.3-6.4-5.3s-6.4 2.4-6.4 5.3 2.9 5.3 6.4 5.3c.8 0 1.5-.1 2.2-.3l2 1-.5-1.7c1.6-1 2.7-2.6 2.7-4.3zm-8.5-1.5a.8.8 0 1 1 0 1.7.8.8 0 0 1 0-1.7zm4.2 0a.8.8 0 1 1 0 1.7.8.8 0 0 1 0-1.7z"/></svg>
        <span id="wechatBtnText">Sign in with WeChat</span>
      </a>
      <a href="/auth/google" class="google-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2 5-4.4 6.6v5.500h7.1c4.1-3.8 6.6-9.4 6.6-16.1z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.1 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.8 28.2c-.4-1.3-.7-2.7-.7-4.2s.2-2.9.7-4.2v-5.7H4.5C2.9 17.3 2 20.5 2 24s.9 6.7 2.5 9.9l7.3-5.7z"/><path fill="#EA4335" d="M24 10.4c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 3.9 29.9 2 24 2 15.4 2 8.1 6.9 4.5 14.1l7.3 5.7c1.7-5.2 6.5-9.4 12.2-9.4z"/></svg>
        <span id="googleBtnText">Sign in with Google</span>
      </a>
    </div>
    <button type="button" id="toggleMode" class="link-btn">Sign in with an account instead</button>
  </form>
  <script>
    const form = document.getElementById('loginForm');
    const input = document.getElementById('passwordInput');
    const emailInput = document.getElementById('emailInput');
    const toggleBtn = document.getElementById('toggleMode');
    const subText = document.getElementById('subText');

    // Two modes: the original shared site password, and per-user accounts.
    // Shared stays the default so nothing changes for existing users; the
    // account mode is what Google/WeChat sign-in will slot into later.
    // Account-type picker. Until real per-user sign-in exists, the shared
    // password lets you choose which role's view of the site to load. It's a
    // preview mechanism rather than a restriction - but the choice is stored
    // in the session and enforced server-side, so supplier scoping behaves
    // exactly as it will for a real supplier account.
    const viewAsWrap = document.getElementById('viewAsWrap');
    const roleSelect = document.getElementById('viewRoleSelect');
    const supplierSelect = document.getElementById('viewSupplierSelect');
    const ROLE_LABELS = {
      admin: 'Juniper Admin',
      internal: 'Juniper Team',
      qa: 'QA/QC',
      supplier: 'Supplier'
    };
    // Surface any message the OAuth callback redirected back with.
    (() => {
      const err = new URLSearchParams(location.search).get('error');
      if (err) { errorMsg.textContent = err; errorMsg.style.display = 'block'; }
    })();

    (async () => {
      try {
        const opts = await (await fetch('/api/login-options')).json();
        // Only offer Google when the server actually has credentials.
        // WeChat: only offered where it can actually work. Official Account
        // authorization silently fails outside WeChat's own browser, so
        // showing the button on a desktop would just dead-end people.
        // WeCom works in any browser: silent inside the app, QR on desktop.
        if (opts.wecom && opts.wecom.enabled) {
          document.getElementById('googleWrap').style.display = '';
          document.getElementById('wecomBtn').style.display = '';
          if (!opts.wecom.inApp) {
            document.getElementById('wecomBtnText').textContent = 'Sign in with WeCom (scan QR)';
          }
        }
        if (opts.wechat && opts.wechat.usable) {
          document.getElementById('googleWrap').style.display = '';
          document.getElementById('wechatBtn').style.display = '';
        }
        if (opts.google && opts.google.enabled) {
          document.getElementById('googleWrap').style.display = '';
          // With several domains allowed, naming one would be misleading.
          const doms = opts.google.domains || [];
          if (doms.length === 1) {
            document.getElementById('googleBtnText').textContent = `Sign in with Google (${doms[0]})`;
          }
        }
        roleSelect.innerHTML = (opts.roles || []).map((r) =>
          `<option value="${r}">${ROLE_LABELS[r] || r}</option>`).join('');
        supplierSelect.innerHTML = '<option value="">Select a supplier...</option>' +
          (opts.suppliers || []).map((sp) => `<option value="${sp.replace(/"/g, '&quot;')}">${sp}</option>`).join('');
      } catch (e) { viewAsWrap.style.display = 'none'; }
    })();
    roleSelect.addEventListener('change', () => {
      // A supplier view needs to know which supplier, or it would scope to
      // nothing and look broken.
      supplierSelect.style.display = roleSelect.value === 'supplier' ? '' : 'none';
    });

    let accountMode = false;
    toggleBtn.addEventListener('click', () => {
      accountMode = !accountMode;
      emailInput.style.display = accountMode ? '' : 'none';
      // A real account carries its own role, so the picker is irrelevant.
      viewAsWrap.style.display = accountMode ? 'none' : '';
      subText.textContent = accountMode ? 'Sign in with your account' : 'Enter the site password to continue';
      toggleBtn.textContent = accountMode ? 'Use the shared site password instead' : 'Sign in with an account instead';
      errorMsg.style.display = 'none';
      (accountMode ? emailInput : input).focus();
    });
    const btn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      errorMsg.style.display = 'none';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(accountMode
            ? { email: emailInput.value, password: input.value }
            : {
              password: input.value,
              viewRole: roleSelect.value,
              viewSupplierName: roleSelect.value === 'supplier' ? supplierSelect.value : ''
            })
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          errorMsg.textContent = body.error || 'Incorrect password';
          errorMsg.style.display = 'block';
          btn.disabled = false;
          return;
        }
        const body = await res.json().catch(() => ({}));
        const params = new URLSearchParams(location.search);
        // Land each role on a page it's actually allowed to open.
        location.href = params.get('next') || body.landing || '/order-management.html';
      } catch (err) {
        errorMsg.textContent = 'Something went wrong - try again';
        errorMsg.style.display = 'block';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
